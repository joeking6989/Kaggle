name: Sony Stand Android APK

on:
  push:
    branches:
      - sony-ipt-ds10m-controller
    paths:
      - 'sony-stand/**'
      - '.github/workflows/sony-stand-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run unit tests
        working-directory: sony-stand
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: sony-stand
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sony-stand-controller-debug
          path: sony-stand/app/build/outputs/apk/debug/app-debug.apk
